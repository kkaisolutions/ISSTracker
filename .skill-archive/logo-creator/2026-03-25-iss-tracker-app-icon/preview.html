<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISS Tracker Icon Concepts</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: rgba(255,255,255,0.07);
        --line: rgba(166, 228, 255, 0.14);
        --text: #eef7ff;
        --muted: #8ea8bb;
        --accent: #66e4ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(102,228,255,0.16), transparent 26rem),
          linear-gradient(180deg, #0a1726, var(--bg));
        color: var(--text);
      }
      main { max-width: 1320px; margin: 0 auto; padding: 36px 20px 80px; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.7rem); letter-spacing: -0.04em; }
      p { color: var(--muted); max-width: 760px; }
      .grid {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(12px);
      }
      img { width: 100%; display: block; aspect-ratio: 1; background: #09111d; }
      .meta { padding: 14px 16px 18px; }
      .name { font-weight: 700; margin-bottom: 4px; }
      .desc { font-size: 0.92rem; color: var(--muted); min-height: 2.6em; }
      a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>ISS Tracker Icon Concepts</h1>
      <p>Ten hand-built SVG icon directions with more detail than the current low-poly look. Open each asset directly to inspect at full size.</p>
      <section class="grid" id="grid"></section>
    </main>
    <script>
      const logos = [
        ["orbital-window.svg", "Orbital Window"],
        ["radar-lock.svg", "Radar Lock"],
        ["globe-flight-path.svg", "Globe + Flight Path"],
        ["monoline-emblem.svg", "Monoline Station Emblem"],
        ["horizon-pass.svg", "Horizon Pass"],
        ["telemetry-badge.svg", "Telemetry Badge"],
        ["night-earth-crosshair.svg", "Night Earth Crosshair"],
        ["orbital-compass.svg", "Orbital Compass"],
        ["footprint-field.svg", "Footprint Field"],
        ["glass-capsule.svg", "Glass Capsule"]
      ];
      const grid = document.getElementById("grid");
      logos.forEach(([file, label], index) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <img src="${file}" alt="${label}">
          <div class="meta">
            <div class="name">${index + 1}. ${label}</div>
            <div class="desc">${file}</div>
            <a href="${file}" target="_blank" rel="noreferrer">Open full size</a>
          </div>
        `;
        grid.appendChild(card);
      });
    </script>
  </body>
</html>
